<script>
// Monkeypatch addEventListener early to neutralize webview JS keyboard handlers.
(function(){
  const blockedKeys = new Set(['f','o','p','s','b','k','t','a','c','v','x','z','y','r','n']);
  function isEditableElement(el){ if(!el) return false; const t=(el.tagName||'').toUpperCase(); return t==='INPUT'||t==='TEXTAREA'||el.isContentEditable; }

  const origAdd = EventTarget.prototype.addEventListener;
  const origRemove = EventTarget.prototype.removeEventListener;
  const perTargetMap = new WeakMap(); // element -> Map(originalListener -> wrapped)

  function shouldWrapForKeyboard(type){ return typeof type === 'string' && /^(keydown|keypress|keyup)$/.test(type); }

  function makeWrapper(listener){
    return function(e){
      try{
        const active = document.activeElement;
        const editable = isEditableElement(active);
        if ((e.ctrlKey||e.metaKey) && !editable) {
          const k = (e.key||'').toLowerCase();
          if (blockedKeys.has(k)) return; // neutralize webview handlers
        }
        if (!editable && e.key === 'F3') return;
      } catch (_) {}
      return listener.apply(this, arguments);
    };
  }

  EventTarget.prototype.addEventListener = function(type, listener, options){
    try{
      if (shouldWrapForKeyboard(type) && typeof listener === 'function') {
        let map = perTargetMap.get(this);
        if (!map) { map = new Map(); perTargetMap.set(this, map); }
        if (map.has(listener)) {
          return origAdd.call(this, type, map.get(listener), options);
        }
        const wrapped = makeWrapper(listener);
        map.set(listener, wrapped);
        return origAdd.call(this, type, wrapped, options);
      }
    } catch (e) { /* fallthrough to default */ }
    return origAdd.call(this, type, listener, options);
  };

  EventTarget.prototype.removeEventListener = function(type, listener, options){
    try{
      if (shouldWrapForKeyboard(type) && typeof listener === 'function') {
        const map = perTargetMap.get(this);
        const wrapped = map && map.get(listener);
        if (wrapped) {
          map.delete(listener);
          return origRemove.call(this, type, wrapped, options);
        }
      }
    } catch (e) {}
    return origRemove.call(this, type, listener, options);
  };

  // Our own handler to focus the toolbar search on Ctrl+F and navigate with F3
  function toolbarCtrlFHandler(e){
    try{
      const active = document.activeElement;
      if ((e.ctrlKey||e.metaKey) && (e.key||'').toLowerCase() === 'f' && !isEditableElement(active)) {
        const s = document.getElementById('searchInput');
        if (s) { s.focus(); s.select && s.select(); e.stopPropagation(); }
      }
      if ((e.key === 'F3') && !isEditableElement(document.activeElement)) {
        if (e.shiftKey) document.getElementById('searchPrev')?.click(); else document.getElementById('searchNext')?.click();
        e.stopPropagation();
      }
    } catch (_) {}
  }
  window.addEventListener('keydown', toolbarCtrlFHandler, { capture: true });

})();
</script>

/* =========================================
   MODERN THEME SWITCH (Rediseño Mejorado)
   ========================================= */

.modern-theme-switch {
  position: relative;
  display: flex;
  align-items: center;
  /* Fondo interno tipo 'pozo' */
  background: var(--bg-input);
  border: 1px solid var(--border-input);
  border-radius: 999px;
  padding: 3px;
  width: 108px; /* Ancho optimizado para 3 iconos */
  height: 36px;
  box-shadow: inset 0 2px 5px var(--inset-dark-04);
  transition: var(--transition);
  cursor: pointer;
}

[data-theme="dark"] .modern-theme-switch {
  box-shadow: inset 0 2px 5px var(--inset-dark-2);
}

/* El elemento deslizante (la caja que resalta el botón activo) */
.modern-theme-switch .mts-slider {
  position: absolute;
  width: 32px;
  height: 28px;
  background: var(--bg-app); /* Contrasta con el fondo */
  border-radius: 999px;
  /* Sombra para dar efecto de relieve sobre el pozo */
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
  transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), background-color 0.3s ease;
  z-index: 1;
}

[data-theme="dark"] .modern-theme-switch .mts-slider {
  background: var(--bg-toolbar);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3), 0 1px 2px rgba(0, 0, 0, 0.2), inset 0 1px 0 var(--inset-white-05);
}

/* Botones individuales (Sol, Luna, Auto) */
.modern-theme-switch .mts-btn {
  position: relative;
  flex: 1; /* Distribute space evenly */
  height: 100%;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  color: var(--text-muted);
  border: none;
  padding: 0;
  margin: 0;
  z-index: 2; /* Siempre por encima del slider */
  border-radius: 999px;
  transition: color 0.2s ease, transform 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  outline: none;
}

.modern-theme-switch .mts-btn .material-symbols-rounded {
  font-size: 1.25rem; /* Iconos un poco más legibles */
}

.modern-theme-switch .mts-btn:hover {
  color: var(--text-main);
  transform: scale(1.05); /* Pequeño efecto pop al pasar el ratón */
}

/* Resaltado del botón activo (el que coincide con el estado general) */
.modern-theme-switch[data-state="light"] .mts-btn[data-val="light"],
.modern-theme-switch[data-state="dark"] .mts-btn[data-val="dark"],
.modern-theme-switch[data-state="auto"] .mts-btn[data-val="auto"] {
  color: var(--brand-primary);
  /* Se elimina el transform scale aquí para que quede en reposo sobre el slider */
  transform: none;
}

/* Foco de accesibilidad */
.modern-theme-switch .mts-btn:focus-visible {
  box-shadow: 0 0 0 2px var(--brand-focus-12);
}

/* Posiciones exactas del slider dependiendo del estado */
/* (108px total - 6px padding) = 102px inner space / 3 buttons = 34px per button */
.modern-theme-switch[data-state="light"] .mts-slider {
  transform: translateX(1px); /* Posición Izquierda */
}

.modern-theme-switch[data-state="dark"] .mts-slider {
  transform: translateX(34px); /* Posición Centro */
}

.modern-theme-switch[data-state="auto"] .mts-slider {
  transform: translateX(67px); /* Posición Derecha */
}

/* Ajustes Responsive (Para los media queries ya existentes al final de tu archivo) */
@media (max-width: 1000px) {
  .modern-theme-switch {
    width: 90px;
    height: 32px;
    padding: 2px;
  }
  .modern-theme-switch .mts-slider {
    width: 27px;
    height: 26px;
  }
  .modern-theme-switch .mts-btn .material-symbols-rounded {
    font-size: 1rem;
  }
  .modern-theme-switch[data-state="light"] .mts-slider { transform: translateX(1px); }
  .modern-theme-switch[data-state="dark"] .mts-slider { transform: translateX(29px); }
  .modern-theme-switch[data-state="auto"] .mts-slider { transform: translateX(58px); }
}

@media (max-width: 650px) {
  .modern-theme-switch {
    display: none !important; /* Si quieres seguir ocultándolo en móvil como en el original */
  }
}

/* ==========================================================================
   COMPONENTES: BOTONES (.btn)
   ========================================================================== */

/* 1. CLASE BASE: Estructura compartida por TODOS los botones */
.btn {
  all: unset;
  box-sizing: border-box;
  font-family: inherit;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;

.btn.active,
.btn.active-tool,
.btn[aria-pressed="true"] {

   MODIFICADORES
   ========================================================================== */

.btn--icon {
  width: 32px;
  padding: 0;
  font-size: 1rem;
}

/* Ensure material icons are perfectly centered inside buttons */
.btn .material-symbols-rounded {

<script>
/* =================== SUMATRAPDF CORE =================== */
const toolbarText={}; 
const pageInput=document.getElementById('pageInput'); 
const pageMeta=document.getElementById('pageMeta'); 
const toolbarSubtitle=document.getElementById('toolbarSubtitle');
const openButton=document.getElementById('openButton'); 
const openButtonText=document.getElementById('openButtonText'); 
const searchInput=document.getElementById('searchInput');
const pagePrevButton=document.getElementById('pagePrevButton'); 
const pageNextButton=document.getElementById('pageNextButton');
const zoomOutButton=document.getElementById('zoomOutButton'); 
const zoomInButton=document.getElementById('zoomInButton'); 
const zoomDropdown=document.getElementById('zoomDropdown'); 
const viewModeDropdown=document.getElementById('viewModeDropdown'); 
const continuousToggle=document.getElementById('continuousToggle');
const documentInvertToggle=document.getElementById('documentInvertToggle'); 
const themeSwitch=document.getElementById('themeSwitch');
let currentPage=1; let totalPages=1; let lastAppDark=false; let lastWindowsDark=false; let lastFollowWindows=false; let lastDocInverted=false;

// ensure toggles expose aria-pressed consistent with class
document.querySelectorAll('.toggle').forEach(t => { try { t.setAttribute('aria-pressed', String(t.classList.contains('active'))); } catch(e) {} });

function applyToolbarText(payload={}) {
  Object.assign(toolbarText, payload); 
  if(openButtonText) openButtonText.textContent=toolbarText.openButton||openButtonText.textContent;
  if(searchInput) searchInput.placeholder=toolbarText.searchPlaceholder||searchInput.placeholder;
}
window.hybridToolbarApplyText=applyToolbarText; if(window.__hybridToolbarTextPayload) applyToolbarText(window.__hybridToolbarTextPayload);
function updatePageMeta(t) {
  if (!pageMeta) return;
  pageMeta.textContent = String(t);
}

function updatePageInputWidth(rawValue) {
  if (!pageInput) return;
  const value = String(rawValue ?? pageInput.value ?? '').trim();
  const digitCount = Math.max(1, (value.match(/\d/g) || []).length);
  const viewport = window.innerWidth || 1200;
  let maxDigits = 6;
  if (viewport <= 650) maxDigits = 4;
  else if (viewport <= 1000) maxDigits = 5;
  const widthDigits = Math.max(1, Math.min(maxDigits, digitCount));
  pageInput.style.width = `calc(${widthDigits}ch + 0.9rem)`;
}

function setPage(p) {
  const t = Math.max(1, parseInt(totalPages||'1', 10));
  let n = parseInt(p||'1', 10);
  if (Number.isNaN(n)) n = 1;
  n = Math.min(Math.max(1, n), t);
  currentPage = n;
  if (pageInput) {
    pageInput.max = String(t);
    pageInput.value = String(n);
    updatePageInputWidth(pageInput.value);
  }
  updatePageMeta(t);
  if (pagePrevButton) { const prevDisabled = n <= 1; pagePrevButton.disabled = prevDisabled; pagePrevButton.setAttribute('aria-disabled', String(prevDisabled)); }
  if (pageNextButton) { const nextDisabled = n >= t; pageNextButton.disabled = nextDisabled; pageNextButton.setAttribute('aria-disabled', String(nextDisabled)); }
  return n;
}

function setPageState(c, pCount) {
  const cP = Math.max(1, parseInt(c||'1', 10));
  const t = Math.max(1, parseInt(pCount||'1', 10));
  totalPages = t;
  updatePageMeta(t);
  // delegate to setPage so clamping and nav updates happen in one place
  setPage(cP);
}
window.hybridToolbarSetPageState=setPageState;
function normalizeZoomValue(z) { const n=Math.max(1, Number(z)||100); return (n/100).toFixed(4).replace(/\.0+$/, '').replace(/(\.\d*?)0+$/, '$1'); }
function setZoomState(z) {
  if (!zoomDropdown) return;
  const n = Math.max(1, Number(z) || 100);
  const norm = normalizeZoomValue(n);
  const menu = zoomDropdown.querySelector('.dropdown-menu');
  if (!menu) return;
  let options = Array.from(menu.querySelectorAll('li'));
  let match = options.find(li => String(li.dataset.value) === String(norm));
  if (!match) {
    const li = document.createElement('li'); li.dataset.value = String(norm); li.textContent = Math.round(n) + '%';
    menu.appendChild(li);
    // attach click handler for the new option
    li.addEventListener('click', () => selectZoomOption(zoomDropdown, li));
    options = Array.from(menu.querySelectorAll('li'));
    match = li;
  }
  options.forEach(li => li.classList.toggle('selected', li === match));
  const display = zoomDropdown.querySelector('.dropdown-value');
  if (display) {
    const label = match.cloneNode(true);
    label.querySelectorAll('.material-symbols-rounded').forEach(node => node.remove());
    display.textContent = label.textContent.trim();
  }
}
window.hybridToolbarSetZoomState = setZoomState;

function setToggleStateByExec(execName, state) {
  try {
    const el = document.querySelector('[data-exec="'+String(execName)+'"]');
    if (!el) return;
    if (state) el.classList.add('active'); else el.classList.remove('active');
    el.setAttribute('aria-pressed', String(!!state));
    // clear busy marker if present
    try { clearBusy(el); } catch(e) {}
    // debug post removed: setToggleStateByExec
    try { console.log('toolbar: setToggleStateByExec', execName, !!state); } catch(e) {}
  } catch(e) {}
}
window.hybridToolbarSetToggleState = setToggleStateByExec;

function setToggleStateById(id, state) {
  try {
    const el = document.getElementById(id);
    if (!el) return;
    if (state) el.classList.add('active'); else el.classList.remove('active');
    el.setAttribute('aria-pressed', String(!!state));
    try { clearBusy(el); } catch(e) {}
    // debug post removed: setToggleStateById
    try { console.log('toolbar: setToggleStateById', id, !!state); } catch(e) {}
  } catch(e) {}
}

function setButtonEnabled(id, enabled) {
  try {
    const el = document.getElementById(id);
    if (!el) return;
    if (enabled) { el.removeAttribute('disabled'); el.setAttribute('aria-disabled', 'false'); }
    else { el.setAttribute('disabled', ''); el.setAttribute('aria-disabled', 'true'); }
  } catch(e) {}
}

function hybridToolbarSetBookmarksState(on) { setToggleStateById('bookmarksToggle', !!on); }
function hybridToolbarSetFavoritesState(on) { setToggleStateById('favoritesToggle', !!on); }
function hybridToolbarSetAnnotationAvailability(opts={}) {
  // opts: { highlight: bool, annotate: bool, draw: bool }
  setButtonEnabled('highlightButton', !!opts.highlight);
  setButtonEnabled('underlineButton', !!opts.highlight);
  setButtonEnabled('strikeoutButton', !!opts.highlight);
  setButtonEnabled('annotateButton', !!opts.annotate);
  setButtonEnabled('drawButton', !!opts.draw);
}
window.hybridToolbarSetBookmarksState = hybridToolbarSetBookmarksState;
window.hybridToolbarSetFavoritesState = hybridToolbarSetFavoritesState;
window.hybridToolbarSetAnnotationAvailability = hybridToolbarSetAnnotationAvailability;

// Backwards-compatible aliases (some native callers may use unprefixed names)
window.setBookmarksState = hybridToolbarSetBookmarksState;
window.setFavoritesState = hybridToolbarSetFavoritesState;
window.setAnnotationAvailability = hybridToolbarSetAnnotationAvailability;
window.setToggleStateByExec = setToggleStateByExec;
window.setToggleStateById = setToggleStateById;

function notifyPanelState(name, active) {
  try {
    const n = String(name||'').toLowerCase();
    if (n === 'favorites' || n === 'favorite' || n === 'fav') {
      setToggleStateById('favoritesToggle', !!active);
    } else if (n === 'bookmarks' || n === 'bookmark' || n === 'marks') {
      setToggleStateById('bookmarksToggle', !!active);
    }
    // clear any busy markers on relevant toggles
    try { clearBusy(document.getElementById('favoritesToggle')); } catch(e) {}
    try { clearBusy(document.getElementById('bookmarksToggle')); } catch(e) {}
    // debug post removed: notifyPanelState
    try { console.log('toolbar: notifyPanelState', name, !!active); } catch(e) {}
  } catch(e) {}
}
window.notifyPanelState = notifyPanelState;
window.panelStateChanged = notifyPanelState;

function hybridToolbarApplyTheme(p={}) {
  const root=document.documentElement; const keys=['canvas','panel','panel2','stroke','text','muted','btn','accent','brand1','brand2'];
  for(const k of keys) { if(p[k]) root.style.setProperty('--'+k, p[k]); }
  const aD=!!p.appDark; root.dataset.theme=aD?'dark':'light';
  lastFollowWindows = !!p.followWindows; lastAppDark = aD; lastWindowsDark = !!p.windowsDark;
  if(themeSwitch) themeSwitch.setAttribute('data-state', lastFollowWindows ? 'auto' : (aD ? 'dark' : 'light'));
  // keep document invert toggle in sync (use centralized setter)
  if (typeof setToggleStateByExec === 'function') setToggleStateByExec('toggleDocumentInvert', !!p.docInverted);
  // ensure theme buttons reflect state visually and via aria
  try {
    const stateVal = lastFollowWindows ? 'auto' : (lastAppDark ? 'dark' : 'light');
    themeSwitch.querySelectorAll('.mts-btn').forEach(btn => { const active = btn.dataset.val === stateVal; btn.classList.toggle('active', active); btn.setAttribute('aria-pressed', String(active)); });
  } catch(e) {}
}
window.hybridToolbarApplyTheme=hybridToolbarApplyTheme; if(window.__hybridToolbarThemePayload) hybridToolbarApplyTheme(window.__hybridToolbarThemePayload);

// Toggles that are controlled by native app state — mark busy but still give optimistic feedback.
const serverSourcedToggles = new Set(['toggleFavorites','toggleBookmarks','toggleDocumentInvert','showPagesContinuously']);
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-exec]'); if (!b || isToolbarUnlocked) return;
  if (b.classList.contains('toggle')) {
    // optimistic visual toggle for responsiveness
    const willActive = !b.classList.contains('active');
    if (willActive) b.classList.add('active'); else b.classList.remove('active');
    try { b.setAttribute('aria-pressed', String(willActive)); } catch(e) {}
    // if state is server-owned, mark busy until native confirms (with timeout fallback)
    try { if (serverSourcedToggles.has(String(b.dataset.exec||''))) markBusy(b); } catch(e) {}
  }
  try {
    if (window.external && typeof window.external.invoke === 'function') {
      const cmdName = String(b.dataset.exec||'');
      const payload = { command: cmdName };
      // If this is a text-annotation command that uses a color, include currently selected color
      const colorCommands = new Set(['highlightSelection','createAnnotUnderline','createAnnotStrikeOut']);
      if (colorCommands.has(cmdName)) {
        const toolKey = String(b.dataset.tool || activeAnnotTool || '').toLowerCase();
        const selectedHex = normalizeAnnotColorHex(
          (annotColorState && annotColorState[toolKey]) ||
          (defaultAnnotColors && defaultAnnotColors[toolKey])
        );
        if (selectedHex) {
          payload.value = selectedHex;
          const chip = typeof getAnnotChipByHex === 'function' ? getAnnotChipByHex(selectedHex) : null;
          if (chip) {
            payload.color = chip.dataset.name || chip.getAttribute('data-name') || '';
          }
        }
      }
      window.external.invoke(JSON.stringify({ type: 'command', name: 'execCommand', payload: payload, ts: Date.now() }));
    }
  } catch (e) { console.error('invoke execCommand error', e); }
});

// Busy helper with timeout fallback
const BUSY_TIMEOUT_MS = 1500;
function markBusy(el) {
  try {
    if (!el) return;
    el.setAttribute('aria-busy', 'true');
    if (el.__busyTimer) clearTimeout(el.__busyTimer);
    el.__busyTimer = setTimeout(() => { try { el.removeAttribute('aria-busy'); el.__busyTimer = null; } catch (e) {} }, BUSY_TIMEOUT_MS);
  } catch(e) {}
}
function clearBusy(el) { try { if (!el) return; if (el.__busyTimer) { clearTimeout(el.__busyTimer); el.__busyTimer = null; } el.removeAttribute('aria-busy'); } catch(e) {} }

document.querySelectorAll('[data-cmd]').forEach(b => b.addEventListener('click', () => {
  if (isToolbarUnlocked) return;
  const cmd = b.dataset.cmd;
  if (cmd === 'goToPage') {
    const delta = parseInt(b.dataset.delta||'0', 10) || 0;
    const before = currentPage;
    const base = parseInt(pageInput?.value||String(currentPage), 10) || currentPage;
    const desired = base + delta;
    const newPage = setPage(desired);
    if (newPage !== before) if (window.external && typeof window.external.invoke === 'function') window.external.invoke(JSON.stringify({ type: 'command', name: 'goToPage', payload: { page: newPage }, ts: Date.now() }));
    return;
  }
}));

if(pageInput) { pageInput.addEventListener('input', () => { updatePageInputWidth(pageInput.value); }); pageInput.addEventListener('change', () => { if (window.external && typeof window.external.invoke === 'function') window.external.invoke(JSON.stringify({ type: 'command', name: 'goToPage', payload: { page: setPage(pageInput.value) }, ts: Date.now() })); }); pageInput.addEventListener('keydown', (e) => { if(e.key==='Enter') pageInput.dispatchEvent(new Event('change')); }); }
window.addEventListener('resize', () => { updatePageInputWidth(pageInput?.value); });
updatePageInputWidth(pageInput?.value);
// wire up custom dropdowns
function selectZoomOption(dropdown, li) {
  const menu = dropdown.querySelector('.dropdown-menu');
  Array.from(menu.querySelectorAll('li')).forEach(i => i.classList.toggle('selected', i === li));
  const display = dropdown.querySelector('.dropdown-value');
  if (display) {
    const label = li.cloneNode(true);
    label.querySelectorAll('.material-symbols-rounded').forEach(node => node.remove());
    display.textContent = label.textContent.trim();
  }
  dropdown.classList.remove('open'); dropdown.querySelector('.dropdown-trigger')?.setAttribute('aria-expanded', 'false');
  const val = parseFloat(li.dataset.value);
  if (window.external && typeof window.external.invoke === 'function') window.external.invoke(JSON.stringify({ type: 'command', name: 'zoom', payload: { value: val }, ts: Date.now() }));
}

function selectViewModeOption(dropdown, li) {
  const menu = dropdown.querySelector('.dropdown-menu');
  Array.from(menu.querySelectorAll('li')).forEach(i => i.classList.toggle('selected', i === li));
  const display = dropdown.querySelector('.dropdown-value');
  if (display) {
    const icon = li.querySelector('.material-symbols-rounded');
    if (icon) display.innerHTML = icon.outerHTML;
    else display.textContent = li.textContent.trim();
  }
  dropdown.classList.remove('open'); dropdown.querySelector('.dropdown-trigger')?.setAttribute('aria-expanded', 'false');
  const cmd = String(li.dataset.value || '');
  if (window.external && typeof window.external.invoke === 'function') window.external.invoke(JSON.stringify({ type: 'command', name: 'execCommand', payload: { command: cmd }, ts: Date.now() }));
}

if (zoomDropdown) {
  const trigger = zoomDropdown.querySelector('.dropdown-trigger');
  const menu = zoomDropdown.querySelector('.dropdown-menu');
  trigger?.addEventListener('click', (e) => {
    e.stopPropagation();
    // close other dropdowns and reset their inline state
    document.querySelectorAll('.custom-dropdown.open').forEach(d => {
      if (d !== zoomDropdown) d.classList.remove('open');
      d.classList.remove('dropup','inline');
      d.querySelector('.dropdown-menu')?.classList.remove('clamped-left','clamped-right');
    });
    // toggle open
    const willOpen = !zoomDropdown.classList.contains('open');
    zoomDropdown.classList.toggle('open', willOpen);
    // open inline inside toolbar to avoid WebView clipping
    setDropdownInline(zoomDropdown, willOpen);
    const expanded = willOpen;
    trigger.setAttribute('aria-expanded', String(expanded));
  });
  Array.from(menu.querySelectorAll('li')).forEach(li => li.addEventListener('click', () => selectZoomOption(zoomDropdown, li)));
}

if (viewModeDropdown) {
  const trigger = viewModeDropdown.querySelector('.dropdown-trigger');
  const menu = viewModeDropdown.querySelector('.dropdown-menu');
  trigger?.addEventListener('click', (e) => {
    e.stopPropagation();
    document.querySelectorAll('.custom-dropdown.open').forEach(d => { if (d !== viewModeDropdown) d.classList.remove('open'); d.classList.remove('dropup','inline'); d.querySelector('.dropdown-menu')?.classList.remove('clamped-left','clamped-right'); });
    const willOpen = !viewModeDropdown.classList.contains('open');
    viewModeDropdown.classList.toggle('open', willOpen);
    setDropdownInline(viewModeDropdown, willOpen);
    const expanded = willOpen;
    trigger.setAttribute('aria-expanded', String(expanded));
  });
  Array.from(menu.querySelectorAll('li')).forEach(li => li.addEventListener('click', () => selectViewModeOption(viewModeDropdown, li)));
}

// close dropdowns when clicking outside
document.addEventListener('click', () => { document.querySelectorAll('.custom-dropdown.open').forEach(d => { d.classList.remove('open'); setDropdownInline(d, false); }); });

// Positioning helper: keep dropdowns inside the WebView viewport by flipping or clamping
function positionDropdown(dropdown) {
  try {
    const menu = dropdown.querySelector('.dropdown-menu');
    if (!menu) return;
    // reset any previous inline adjustments
    dropdown.classList.remove('dropup');
    menu.classList.remove('clamped-left','clamped-right');
    menu.style.left = '';
    menu.style.right = '';
    // measure
    const rect = dropdown.getBoundingClientRect();
    // ensure menu is temporarily visible to measure height
    menu.style.visibility = 'hidden';
    menu.style.display = 'block';
    const menuRect = menu.getBoundingClientRect();
    menu.style.display = '';
    menu.style.visibility = '';
    const spaceBelow = window.innerHeight - rect.bottom;
    const spaceAbove = rect.top;
    // if not enough space below but enough above, open upwards
    if (spaceBelow < menuRect.height && spaceAbove > menuRect.height) {
      dropdown.classList.add('dropup');
    }
    // horizontal clamping: compute desired left in px
    const desiredLeft = rect.left + rect.width / 2 - menuRect.width / 2;
    if (desiredLeft < 8) {
      // clamp to left edge
      menu.classList.add('clamped-left');
      menu.style.left = '8px';
      menu.style.right = '';
    } else if ((desiredLeft + menuRect.width) > (window.innerWidth - 8)) {
      // clamp to right edge
      menu.classList.add('clamped-right');
      menu.style.right = '8px';
      menu.style.left = '';
    } else {
      // center as default (keep existing CSS behavior)
      menu.style.left = '50%';
      menu.style.right = '';
      menu.style.transform = dropdown.classList.contains('dropup') ? 'translateX(-50%) translateY(0)' : 'translateX(-50%) translateY(0)';
    }
  } catch (e) { console.error('positionDropdown error', e); }
}

function setDropdownInline(dropdown, on) {

}

/* =================== CUSTOMIZATION =================== */
const toolbarItemsContainer = document.getElementById('toolbarItems');
const contextMenu = document.getElementById('nativeContextMenu');
const mainToolbar = document.getElementById('mainToolbar');

let isToolbarUnlocked = false; 
const LS_KEY = 'sumatra-toolbar-layout-v4';
const autoCompactPriority = ['grp-theme', 'grp-actions', 'grp-tools'];
let autoCompactScheduled = false;
let toolbarResizeObserver = null; 
let autoCompactTimerId = null;
let lastCompactState = false;
let lastAutoHidden = new Set();
let isHostResizing = false;

window.__setHostResizing = function(isResizing) {
  isHostResizing = !!isResizing;
  document.documentElement.classList.toggle('host-resizing', isHostResizing);
  if (!isHostResizing) {
    scheduleAutoCompact();
  }
};

function scheduleAutoCompact() {
  if (isHostResizing) return;
  // Debounce rapid resize/RO events to avoid flicker.
  if (autoCompactTimerId) clearTimeout(autoCompactTimerId);
  autoCompactTimerId = setTimeout(() => {
    autoCompactTimerId = null;
    applySmartToolbarCompaction();
  }, 140);
}

function applySmartToolbarCompaction() {
  if (!toolbarItemsContainer) return;
  if (isHostResizing) return;
  // If editing layout, ensure compact/auto-hidden are cleared but avoid DOM churn
  if (isToolbarUnlocked) {
    if (lastCompactState) {
      toolbarItemsContainer.classList.remove('toolbar-items--compact');
      lastCompactState = false;
    }
    if (lastAutoHidden.size) {
      lastAutoHidden.forEach(id => {
        const el = document.getElementById(id);
        if (el) el.classList.remove('auto-hidden');
      });
      lastAutoHidden.clear();
    }
    toolbarItemsContainer.querySelectorAll('.compact').forEach(el => el.classList.remove('compact'));
    return;
  }

  // Compute desired compact state with hysteresis to avoid oscillation near threshold
  const overflowNow = toolbarItemsContainer.scrollWidth > toolbarItemsContainer.clientWidth + 2;
  const hasSpareRoom = toolbarItemsContainer.scrollWidth < toolbarItemsContainer.clientWidth - 40;
  const needsCompact = lastCompactState ? !hasSpareRoom : overflowNow;

  // Apply or remove compact mode only if it changed
  if (needsCompact && !lastCompactState) {
    toolbarItemsContainer.classList.add('toolbar-items--compact');
    toolbarItemsContainer.querySelectorAll('.control-group, .modern-pagination-group, .theme-control-group, .search-wrapper').forEach(el => el.classList.add('compact'));
    lastCompactState = true;
  } else if (!needsCompact && lastCompactState) {
    toolbarItemsContainer.classList.remove('toolbar-items--compact');
    toolbarItemsContainer.querySelectorAll('.compact').forEach(el => el.classList.remove('compact'));
    lastCompactState = false;
  }

  // After compacting, if still overflowing, pick auto-hide candidates
  const currentlyOverflowing = toolbarItemsContainer.scrollWidth > toolbarItemsContainer.clientWidth + 2;
  const newAutoHidden = new Set();
  if (currentlyOverflowing && lastCompactState) {
    const candidates = autoCompactPriority.map(id => document.getElementById(id)).filter(el => el && !el.classList.contains('is-hidden'));
    let j = 0;
    while (toolbarItemsContainer.scrollWidth > toolbarItemsContainer.clientWidth + 2 && j < candidates.length) {
      newAutoHidden.add(candidates[j].id);
      j += 1;
    }
  }

  // Apply diffs: remove old auto-hidden not in new set
  lastAutoHidden.forEach(id => { if (!newAutoHidden.has(id)) { const el = document.getElementById(id); if (el) el.classList.remove('auto-hidden'); }});
  // Add newly hidden
  newAutoHidden.forEach(id => { if (!lastAutoHidden.has(id)) { const el = document.getElementById(id); if (el) el.classList.add('auto-hidden'); }});
  lastAutoHidden = newAutoHidden;
}

function initSmartToolbarCompaction() {
  if (!toolbarItemsContainer || !mainToolbar) return;
  if (toolbarResizeObserver) {
    try { toolbarResizeObserver.disconnect(); } catch (e) {}
  }
  toolbarResizeObserver = new ResizeObserver(() => scheduleAutoCompact());
  toolbarResizeObserver.observe(mainToolbar);
  toolbarResizeObserver.observe(toolbarItemsContainer);
  scheduleAutoCompact();
}

function updateEditMode() {
  Array.from(toolbarItemsContainer.children).forEach(el => el.setAttribute('draggable', isToolbarUnlocked ? 'true' : 'false'));

let draggingElement = null;
toolbarItemsContainer.addEventListener('dragstart', e => {
  if (!isToolbarUnlocked) { e.preventDefault(); return; }
  draggingElement = e.target.closest('[data-name]');
  if (!draggingElement) return;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => draggingElement.classList.add('dragging'), 0);
});

toolbarItemsContainer.addEventListener('dragover', e => {
  e.preventDefault();
  if (!draggingElement || !isToolbarUnlocked) return;
  const afterElement = getDragAfterElement(toolbarItemsContainer, e.clientX);
  if (afterElement == null) toolbarItemsContainer.appendChild(draggingElement);
  else toolbarItemsContainer.insertBefore(draggingElement, afterElement);
});

toolbarItemsContainer.addEventListener('dragend', () => { if (draggingElement) draggingElement.classList.remove('dragging'); draggingElement = null; });

function getDragAfterElement(container, x) {
  const draggableElements = [...container.querySelectorAll('[data-name]:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) { return { offset: offset, element: child }; } 
    else { return closest; }
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

const colorSelectorBtn = document.getElementById('colorSelectorBtn');
const commonColorPalette = document.getElementById('commonColorPalette');
const colorChips = Array.from(document.querySelectorAll('#commonColorPalette .color-chip'));
const annotColorStorageKey = 'sumatra-toolbar-annot-colors-v1';
const defaultAnnotColors = {
  highlight: '#facc15',
  underline: '#22c55e',
  strikeout: '#ef4444',
};
const annotToolLabels = {
  highlight: 'Highlight',
  underline: 'Underline',
  strikeout: 'Strikeout',
};

let activeAnnotTool = 'highlight';
let annotColorState = loadAnnotColorState();

const annotButtons = [
  { id: 'highlightButton', tool: 'highlight' },
  { id: 'underlineButton', tool: 'underline' },
  { id: 'strikeoutButton', tool: 'strikeout' },
];

function normalizeAnnotColorHex(colorHex) {
  const value = String(colorHex || '').trim().toLowerCase();
  if (!value) return '';
  return value.startsWith('#') ? value : `#${value}`;
}

function loadAnnotColorState() {
  const nextState = { ...defaultAnnotColors };
  /*try {
    const raw = localStorage.getItem(annotColorStorageKey);
    if (!raw) return nextState;
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== 'object') return nextState;
    Object.keys(defaultAnnotColors).forEach(tool => {
      const saved = normalizeAnnotColorHex(parsed[tool]);
      if (saved) nextState[tool] = saved;
    });
  } catch (e) {} */
  return nextState;
}

function saveAnnotColorState() {
  try {
    localStorage.setItem(annotColorStorageKey, JSON.stringify(annotColorState));
  } catch (e) {}
}

function getAnnotChipByHex(colorHex) {
  const target = normalizeAnnotColorHex(colorHex);
  if (!target) return null;
  return colorChips.find(chip => normalizeAnnotColorHex(chip.dataset.color) === target) || null;
}

function setPaletteActiveChip(colorHex) {
  const targetChip = getAnnotChipByHex(colorHex);
  colorChips.forEach(chip => chip.classList.toggle('active', chip === targetChip));
}

function syncAnnotToolSwatches() {
  Object.keys(defaultAnnotColors).forEach(tool => {
    const swatch = document.querySelector(`[data-tool-swatch="${tool}"]`);
    if (!swatch) return;
    const colorHex = normalizeAnnotColorHex(annotColorState[tool] || defaultAnnotColors[tool]);
    swatch.style.setProperty('--tool-color', colorHex);
    const chip = getAnnotChipByHex(colorHex);
    const colorName = chip?.getAttribute('title') || chip?.getAttribute('data-name') || colorHex;
    swatch.title = `Saved color for ${annotToolLabels[tool] || tool}: ${colorName}`;
    // Also set the icon ink color on the corresponding button so the SVG reflects the selected color
    const btn = document.querySelector(`[data-tool="${tool}"]`) || document.getElementById(`${tool}Button`);
    if (btn) btn.style.setProperty('--icon-ink-color', colorHex);
  });
}

function syncActiveAnnotToolUI(tool) {
  annotButtons.forEach(btnInfo => {
    const btnEl = document.getElementById(btnInfo.id);
    const wrapper = btnEl?.closest('.annot-tool');
    const isActive = btnInfo.tool === tool;
    if (btnEl) {
      btnEl.classList.toggle('active-tool', isActive);
      btnEl.setAttribute('aria-pressed', String(isActive));
    }
    if (wrapper) wrapper.classList.toggle('is-active', isActive);
  });
}

function setActiveAnnotTool(tool) {
  if (!tool || !defaultAnnotColors[tool]) tool = 'highlight';
  activeAnnotTool = tool;
  syncActiveAnnotToolUI(tool);
  setPaletteActiveChip(annotColorState[tool] || defaultAnnotColors[tool]);
}

function setAnnotToolColor(tool, colorHex) {
  const normalized = normalizeAnnotColorHex(colorHex) || defaultAnnotColors[tool] || defaultAnnotColors.highlight;
  annotColorState = { ...annotColorState, [tool]: normalized };
  saveAnnotColorState();
  syncAnnotToolSwatches();
  if (tool === activeAnnotTool) setPaletteActiveChip(normalized);
}

annotButtons.forEach(btnInfo => {
  const btnEl = document.getElementById(btnInfo.id);
  if (!btnEl) return;
  btnEl.addEventListener('click', () => {
    setActiveAnnotTool(btnInfo.tool);
  });
});

syncAnnotToolSwatches();
setActiveAnnotTool(activeAnnotTool);

colorSelectorBtn?.addEventListener('click', (e) => {
  e.stopPropagation();
  setPaletteActiveChip(annotColorState[activeAnnotTool] || defaultAnnotColors[activeAnnotTool]);

});

document.addEventListener('click', (e) => {

});

colorChips.forEach(chip => {
  const colorHex = normalizeAnnotColorHex(chip.getAttribute('data-color'));
  chip.style.backgroundColor = colorHex;

  chip.addEventListener('click', () => {
    const colorName = chip.getAttribute('data-name');
    setAnnotToolColor(activeAnnotTool, colorHex);
    setPaletteActiveChip(colorHex);

    const commandName = `set${activeAnnotTool.charAt(0).toUpperCase() + activeAnnotTool.slice(1)}Color`;
    if (window.external && typeof window.external.invoke === 'function') {
      window.external.invoke(JSON.stringify({
        type: 'command',
        name: commandName,
        payload: { color: colorName, value: colorHex },
        ts: Date.now()
      }));

    commonColorPalette.classList.remove('open');
  });
});

/* =========================================
   TOOLBAR ADAPTIVE COMPACTNESS
   ========================================= */
(function() {
  const toolbarContainer = document.getElementById('mainToolbar');
  const toolbarItems = document.getElementById('toolbarItems');

  if (!toolbarContainer || !toolbarItems) return;

  function updateToolbarScale() {
    const availableWidth = toolbarContainer.clientWidth;
    const contentWidth = toolbarItems.scrollWidth;
    if (!availableWidth || !contentWidth) return;

    const hasOverflow = contentWidth > availableWidth - 20;

    // Toggle compact class instead of scaling
    toolbarItems.classList.toggle('toolbar-items--compact', hasOverflow);

    // Also make some control groups more compact when space is tight
    const compactGroups = toolbarItems.querySelectorAll('.grp-zoom, .grp-view, .modern-pagination-group, .grp-tools');
    compactGroups.forEach(g => g.classList.toggle('compact', hasOverflow));
  }

  const resizeObserver = new ResizeObserver(updateToolbarScale);
  resizeObserver.observe(toolbarContainer);
  resizeObserver.observe(toolbarItems);

  window.addEventListener('resize', updateToolbarScale);
  // Also update when fonts or layout potentially change
  window.addEventListener('load', updateToolbarScale);
  setTimeout(updateToolbarScale, 100);
})();

<script>
// Shortcut guard: block webview global shortcuts and route Ctrl+F to the toolbar search.
(function() {
  function isEditableElement(el) {
    if (!el) return false;
    const tag = (el.tagName || '').toUpperCase();
    return tag === 'INPUT' || tag === 'TEXTAREA' || el.isContentEditable;
  }

  window.addEventListener('keydown', (e) => {
    try {
      const active = document.activeElement;
      const editable = isEditableElement(active);

      // Block webview JS handlers but don't prevent defaults so the native app shortcuts still work.
      if ((e.ctrlKey || e.metaKey) && !editable) {
        const k = (e.key || '').toLowerCase();
        const blocked = ['f','o','p','s','b','k','t','a','c','v','x','z','y','r','n'];
        if (blocked.indexOf(k) >= 0) {
          e.stopPropagation();
          e.stopImmediatePropagation && e.stopImmediatePropagation();
          // Special-case: Ctrl+F / Cmd+F should focus the toolbar search input
          if (k === 'f') {
            const s = document.getElementById('searchInput');
            if (s) {
              s.focus();
              if (typeof s.select === 'function') s.select();
            }
          }
        }
      }

      // Handle F3 / Shift+F3 to navigate search results when toolbar search exists
      if (!editable && e.key === 'F3') {
        e.stopPropagation();
        e.stopImmediatePropagation && e.stopImmediatePropagation();
        if (e.shiftKey) document.getElementById('searchPrev')?.click();
        else document.getElementById('searchNext')?.click();
      }
    } catch (err) {
      try { console.error('shortcut-guard error', err); } catch(e){}
    }
  }, { capture: true });
})();
</script>
